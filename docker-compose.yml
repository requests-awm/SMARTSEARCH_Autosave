services:
  smartsearch-auto:
    build: .
    image: smartsearch-auto:latest
    container_name: smartsearch-auto
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      # If using a Google service account file instead of OAuth, mount it and
      # set GOOGLE_SERVICE_ACCOUNT_FILE=/app/service-account.json in .env:
      # - ./service-account.json:/app/service-account.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
